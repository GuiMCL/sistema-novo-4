services:
  mcp-agendamentos:
    container_name: mcp_agendamentos
    build: ./myAutoAtendMCP
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MCP_DB_PATH: /data/agendamentos.db
      MCP_TZ: America/Sao_Paulo
      OWNER_PHONE: "5500000000000"
      ADMIN_USER: ${LOGIN:?Defina LOGIN e SENHA no .env}
      ADMIN_PASS: ${SENHA:?Defina LOGIN e SENHA no .env}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v25.0}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_APPOINTMENT_TEMPLATE: ${WHATSAPP_APPOINTMENT_TEMPLATE:-}
      WHATSAPP_APPOINTMENT_TEMPLATE_2: ${WHATSAPP_APPOINTMENT_TEMPLATE_2:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}
    volumes:
      - mcp_data:/data

volumes:
  mcp_data:
