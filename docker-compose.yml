services:
  mcp-agendamentos:
    container_name: mcp_agendamentos
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MCP_DB_PATH: /data/agendamentos.db
      MCP_TZ: America/Sao_Paulo
      OWNER_PHONE: "5500000000000"
      ADMIN_USER: ${LOGIN:?Defina LOGIN e SENHA no .env}
      ADMIN_PASS: ${SENHA:?Defina LOGIN e SENHA no .env}
      WAIACONNECT_API_KEY: ${WAIACONNECT_API_KEY:?Defina WAIACONNECT_API_KEY no .env}
      WAIACONNECT_BASE_URL: ${WAIACONNECT_BASE_URL:-https://api.waiaconnect.com}
      WAIACONNECT_CONNECTION_ID: ${WAIACONNECT_CONNECTION_ID:?Defina WAIACONNECT_CONNECTION_ID no .env}
    volumes:
      - mcp_data:/data

volumes:
  mcp_data:
