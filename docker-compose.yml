services:
  mcp-agendamentos:
    container_name: mcp_agendamentos
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MCP_DB_PATH: /data/agendamentos.db
      MCP_TZ: America/Sao_Paulo
      OWNER_PHONE: "5500000000000"
      ADMIN_USER: ${LOGIN:?Defina LOGIN e SENHA no .env}
      ADMIN_PASS: ${SENHA:?Defina LOGIN e SENHA no .env}
      WAIACONNECT_API_KEY: ${WAIACONNECT_API_KEY:?Defina WAIACONNECT_API_KEY no .env}
      WAIACONNECT_BASE_URL: ${WAIACONNECT_BASE_URL:-https://api.waiaconnect.com}
      WAIACONNECT_CONNECTION_ID: ${WAIACONNECT_CONNECTION_ID:?Defina WAIACONNECT_CONNECTION_ID no .env}
      WAIACONNECT_CONNECT_TOKEN: ${WAIACONNECT_CONNECT_TOKEN:?Defina WAIACONNECT_CONNECT_TOKEN no .env}
      WHATSAPP_APPOINTMENT_TEMPLATE: ${WHATSAPP_APPOINTMENT_TEMPLATE:-lembrete_agendamento}
      WHATSAPP_APPOINTMENT_TEMPLATE_2: ${WHATSAPP_APPOINTMENT_TEMPLATE_2:-confirmacao_agendamento}
      WHATSAPP_GENERIC_TEMPLATE: ${WHATSAPP_GENERIC_TEMPLATE:-fora_horario_atendimento}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      # whsec_... do endpoint. Vazio = valida só o token estático.
      WAIACONNECT_WEBHOOK_SECRET: ${WAIACONNECT_WEBHOOK_SECRET:-}
    volumes:
      - mcp_data:/data

volumes:
  mcp_data:
